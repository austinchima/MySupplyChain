databases:
  # ─── PostgreSQL Database (Free tier) ──────────────────────────────────────
  - name: mysupplychain-db
    plan: free
    databaseName: mysupplychain
    user: mysupplychain_user

services:
  # ─── .NET Web API ──────────────────────────────────────────────────────────
  - type: web
    name: mysupplychain-api
    plan: free
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ConnectionStrings__DefaultConnection
        fromDatabase:
          name: mysupplychain-db
          property: connectionString
      - key: JwtSettings__Secret
        generateValue: true
      - key: JwtSettings__Issuer
        value: MySupplyChain.API
      - key: JwtSettings__Audience
        value: MySupplyChain.Client
      - key: JwtSettings__ExpiryMinutes
        value: "60"
      # After deploying Vercel, add your frontend URL here:
      # - key: AllowedOrigins__0
      #   value: https://your-app.vercel.app
