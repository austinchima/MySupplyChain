services:
  # ─── PostgreSQL ──────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: mysupplychain-db
    environment:
      POSTGRES_DB: mysupplychain
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # ─── API ──────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mysupplychain-api
    ports:
      - "5000:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: "Production"
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=mysupplychain;Username=postgres;Password=${POSTGRES_PASSWORD}"
      JwtSettings__Secret: "${JWT_SECRET}"
      JwtSettings__Issuer: "MySupplyChain.API"
      JwtSettings__Audience: "MySupplyChain.Client"
      JwtSettings__ExpiryMinutes: "60"
      AllowedOrigins__0: "http://localhost:5173"
      AllowedOrigins__1: "${FRONTEND_URL}"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
