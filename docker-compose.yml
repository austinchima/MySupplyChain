services:
  # ─── SQL Server ──────────────────────────────────────────
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: mysupplychain-db
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD}"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U SA -P "${MSSQL_SA_PASSWORD}" -C -Q "SELECT 1" || exit 1
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ─── API ──────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mysupplychain-api
    ports:
      - "5000:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: "Development"
      ConnectionStrings__DefaultConnection: "Server=sqlserver;Database=MySupplyChainDb;User Id=SA;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True"
      JwtSettings__Secret: "${JWT_SECRET}"
      JwtSettings__Issuer: "MySupplyChain.API"
      JwtSettings__Audience: "MySupplyChain.Client"
      JwtSettings__ExpiryMinutes: "60"
    depends_on:
      sqlserver:
        condition: service_healthy

volumes:
  sqlserver-data:
